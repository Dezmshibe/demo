<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Marula Table Catering | Corporate &amp; event catering{% endblock %}</title>
<meta name="description" content="{% block description %}Corporate and event catering in Gauteng. See our past events, browse our menus and send an enquiry.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}#top" aria-label="Marula Table Catering home">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#17302B"/><circle cx="16" cy="16" r="9" fill="none" stroke="#E8A317" stroke-width="2"/><circle cx="16" cy="16" r="3.5" fill="#E8A317"/></svg>
    <span>Marula Table</span>
  </a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav id="nav" class="nav">
    <a href="#work">Our work</a>
    <a href="#menus">Menus</a>
    <a href="#how">How it works</a>
    <a class="nav-cta" href="#enquire">Send an enquiry</a>
  </nav>
</header>

<main id="main">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p><strong>{{ site.name }}</strong> &middot; {{ site.city }}</p>
  <p>&copy; <span id="year"></span> {{ site.name }}. All rights reserved.</p>
</footer>

<script>window.APP_CONFIG = {{ client_config | tojson }};</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
